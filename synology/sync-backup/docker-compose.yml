version: '3.8'

services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone-sync
    restart: none
    environment:
      - TZ=Europe/Berlin
    command: "sync /data storage-box-encrypted:/homeoffice-docker-volumes-backup --progress"
    volumes:
      - /volume1/backup-docker-volumes:/data:ro
      - /volume1/docker/tt-homeoffice/dsm-198/rclone/rclone.conf:/config/rclone/rclone.conf
    # Optional: für Debugging
    stdin_open: true
    tty: true
