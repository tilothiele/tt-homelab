version: '3.8'

services:
  rclone:
    image: rclone/rclone:latest
    container_name: rclone-sync
    restart: unless-stopped
    command: sync /data remote:backup --progress
    environment:
      - TZ=Europe/Berlin
      - RCLONE_CONFIG_HETZNER_TYPE=sftp
      - RCLONE_CONFIG_HETZNER_HOST=${HETZNER_HOST}
      - RCLONE_CONFIG_HETZNER_USER=${HETZNER_USER}
      - RCLONE_CONFIG_HETZNER_PASS=${HETZNER_PASS}
      - RCLONE_CONFIG_HETZNER_SHELL_TYPE=unix
      - RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND=none
      - RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND=none
    command: "sync /data HETZNER:/homeoffice-docker-volumes-backup --progress"
    volumes:
      - /volume1/backup-docker-volumes:/data:ro
    # Optional: für Debugging
    stdin_open: true
    tty: true
